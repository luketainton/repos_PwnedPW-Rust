name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  prepare:
    name: Prepare release and publish crate
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set Cargo version from release tag
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${PACKAGE_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a valid v-prefixed Cargo version: $PACKAGE_VERSION" >&2
            exit 1
          fi
          VERSION="$version" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Cargo.toml")
          text = path.read_text()
          version = os.environ["VERSION"]
          updated, count = re.subn(
              r'(?ms)(\[package\].*?^version\s*=\s*)"[^"]+"',
              rf'\1"{version}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("could not find [package] version in Cargo.toml")
          path.write_text(updated)
          PY
          cargo check
      - name: Publish crate to Gitea Cargo registry
        env:
          CARGO_REGISTRIES_GITEA_INDEX: sparse+${{ github.server_url }}/api/packages/repos/cargo/
          CARGO_REGISTRIES_GITEA_TOKEN: Bearer ${{ secrets.ACTIONS_TOKEN }}
        run: cargo publish --locked --allow-dirty --registry gitea
      - name: Reuse or create Gitea release
        id: release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_API: ${{ github.server_url }}/api/v1
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          release_url="$GITEA_API/repos/$REPOSITORY/releases/tags/$RELEASE_TAG"
          release_status=$(curl --silent --show-error \
            --header "Authorization: token $GITEA_TOKEN" \
            --output /tmp/pwnedpw-release.json \
            --write-out '%{http_code}' \
            "$release_url")

          if [ "$release_status" = "200" ]; then
            echo "Using existing Gitea release for $RELEASE_TAG"
            release_json=$(< /tmp/pwnedpw-release.json)
          elif [ "$release_status" = "404" ]; then
            echo "Creating Gitea release for $RELEASE_TAG"
            release_json=$(curl --silent --show-error --fail-with-body \
              --request POST \
              --header "Authorization: token $GITEA_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "{\"tag_name\":\"$RELEASE_TAG\",\"name\":\"$RELEASE_TAG\",\"body\":\"Automated release $RELEASE_TAG\"}" \
              "$GITEA_API/repos/$REPOSITORY/releases")
          else
            cat /tmp/pwnedpw-release.json
            echo "Release lookup failed with HTTP $release_status" >&2
            exit 1
          fi

          release_id=$(printf '%s' "$release_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          upload_url=$(printf '%s' "$release_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["upload_url"])')
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "upload_url=$upload_url" >> "$GITHUB_OUTPUT"

  build:
    name: Build and upload ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            target: x86_64-unknown-linux-gnu
            binary: pwnedpw
            asset: pwnedpw-${{ github.ref_name }}-linux-x86_64
          - name: macOS x86_64
            target: x86_64-apple-darwin
            binary: pwnedpw
            asset: pwnedpw-${{ github.ref_name }}-macos-x86_64
          - name: Windows x86_64
            target: x86_64-pc-windows-gnu
            binary: pwnedpw.exe
            asset: pwnedpw-${{ github.ref_name }}-windows-x86_64.exe
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux cross-compilation tools
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
              apt-get install --yes binutils-mingw-w64-x86-64 gcc-mingw-w64-x86-64 zip curl xz-utils
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache mingw-w64-binutils zip curl xz
          else
            echo "No supported package manager found for cross-compilation tools" >&2
            exit 1
          fi
          if ! command -v zig >/dev/null 2>&1; then
            zig_version=0.14.1
            zig_archive="zig-x86_64-linux-${zig_version}.tar.xz"
            curl --fail --silent --show-error --location \
              "https://ziglang.org/download/${zig_version}/${zig_archive}" \
              --output "/tmp/${zig_archive}"
            tar -xJf "/tmp/${zig_archive}" -C /tmp
            zig_dir="/opt/zig-${zig_version}"
            install -d -m 0755 "${zig_dir}"
            cp -R "/tmp/zig-x86_64-linux-${zig_version}/." "${zig_dir}/"
            echo "${zig_dir}" >> "${GITHUB_PATH}"
            export PATH="${zig_dir}:${PATH}"
          fi
          zig version
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            macos_sdk_version=14.5
            macos_sdk_archive="MacOSX${macos_sdk_version}.sdk.tar.xz"
            curl --fail --silent --show-error --location \
              "https://github.com/joseluisq/macosx-sdks/releases/download/${macos_sdk_version}/${macos_sdk_archive}" \
              --output "/tmp/${macos_sdk_archive}"
            macos_sdk_dir="/opt/MacOSX${macos_sdk_version}.sdk"
            tar -xJf "/tmp/${macos_sdk_archive}" -C /opt
            echo "MACOS_SDK=${macos_sdk_dir}" >> "${GITHUB_ENV}"
          fi
      - name: Configure cross-compilers
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          case "${{ matrix.target }}" in
            x86_64-apple-darwin)
              printf '%s\n' \
                '#!/usr/bin/env bash' \
                'args=(--target=x86_64-macos)' \
                'for arg in "$@"; do' \
                '  case "$arg" in' \
                '    --target=x86_64-apple-macosx) arg=--target=x86_64-macos ;;' \
                '  esac' \
                '  args+=("$arg")' \
                'done' \
                'exec zig cc -isysroot "${MACOS_SDK}" "${args[@]}"' > /tmp/zig-apple-cc
              chmod +x /tmp/zig-apple-cc
              echo "CC_x86_64_apple_darwin=/tmp/zig-apple-cc" >> "$GITHUB_ENV"
              echo "CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER=/tmp/zig-apple-cc" >> "$GITHUB_ENV"
              ;;
            x86_64-pc-windows-gnu)
              printf '%s\n' \
                '#!/usr/bin/env bash' \
                'args=(--target=x86_64-windows-gnu -L /usr/x86_64-w64-mingw32/lib)' \
                'for arg in "$@"; do' \
                '  case "$arg" in' \
                '    --target=x86_64-pc-windows-gnu) arg=--target=x86_64-windows-gnu ;;' \
                '    -Wl,-Bdynamic) arg=-Wl,-Bstatic ;;' \
                '  esac' \
                '  args+=("$arg")' \
                'done' \
                'exec zig cc "${args[@]}"' > /tmp/zig-windows-cc
              chmod +x /tmp/zig-windows-cc
              echo "CC_x86_64_pc_windows_gnu=/tmp/zig-windows-cc" >> "$GITHUB_ENV"
              echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=/tmp/zig-windows-cc" >> "$GITHUB_ENV"
              ;;
          esac
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Upload binary directly to Gitea release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_API: ${{ github.server_url }}/api/v1
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          UPLOAD_URL: ${{ needs.prepare.outputs.upload_url }}
          ASSET_NAME: ${{ matrix.asset }}
          ASSET_PATH: target/${{ matrix.target }}/release/${{ matrix.binary }}
        shell: bash
        run: |
          set -euo pipefail
          assets_json=$(curl --silent --show-error --fail-with-body \
            --header "Authorization: token $GITEA_TOKEN" \
            "$GITEA_API/repos/$REPOSITORY/releases/$RELEASE_ID/assets")
          existing_id=$(ASSETS_JSON="$assets_json" ASSET_NAME="$ASSET_NAME" python3 -c \
            'import json,os; data=json.loads(os.environ["ASSETS_JSON"]); print(next((str(a["id"]) for a in data if a.get("name") == os.environ["ASSET_NAME"]), ""))')
          if [ -n "$existing_id" ]; then
            echo "Replacing existing asset $ASSET_NAME"
            curl --silent --show-error --fail-with-body \
              --request DELETE \
              --header "Authorization: token $GITEA_TOKEN" \
              "$GITEA_API/repos/$REPOSITORY/releases/$RELEASE_ID/assets/$existing_id"
          fi
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: token $GITEA_TOKEN" \
            --form "attachment=@$ASSET_PATH" \
            "$UPLOAD_URL?name=$ASSET_NAME"
