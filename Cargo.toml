[package]
name = "pwnedpw"
version = "0.1.0"
edition = "2021"
description = "Checks if your password has been leaked."
license = "MIT"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha1 = "0.10"
rpassword = "7"
atty = "0.2"

[dev-dependencies]
mockito = "1"
